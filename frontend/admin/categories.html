<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Danh Mục - Admin Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-body">

    <aside class="admin-sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-book-half text-warning fs-4"></i>
            <span>Bookstore Admin</span>
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a class="nav-link" href="/admin/index.html"><i class="bi bi-speedometer2"></i> Dashboard Thống Kê</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/books.html"><i class="bi bi-journal-bookmark"></i> Quản Lý Sách</a></li>
            <li class="nav-item"><a class="nav-link active" href="/admin/categories.html"><i class="bi bi-diagram-3"></i> Quản Lý Danh Mục</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/authors.html"><i class="bi bi-person-lines-fill"></i> Quản Lý Tác Giả</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/publishers.html"><i class="bi bi-building"></i> Quản Lý NXB</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/orders.html"><i class="bi bi-receipt"></i> Quản Lý Đơn Hàng</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin/comments.html"><i class="bi bi-chat-dots"></i> Kiểm Duyệt Bình Luận</a></li>
            <li class="nav-item mt-4 border-top border-secondary pt-3"><a class="nav-link text-warning" href="/index.html"><i class="bi bi-shop"></i> Xem Trang Khách Hàng</a></li>
        </ul>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <h5 class="m-0 fw-bold"><i class="bi bi-diagram-3 me-2 text-primary"></i>Phân Cấp Danh Mục Sách</h5>
            <button class="btn btn-primary fw-semibold" onclick="openAddCatModal()">
                <i class="bi bi-plus-lg me-1"></i>Thêm Danh Mục
            </button>
        </header>

        <main class="admin-content">
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="table-responsive">
                    <table class="table align-middle table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Mã DM</th>
                                <th>Tên Danh Mục</th>
                                <th>Cấp Bậc (Danh Mục Cha)</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody">
                            <tr><td colspan="4" class="text-center py-4 text-muted">Đang tải danh mục...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Danh Mục -->
    <div class="modal fade" id="catModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content rounded-4">
                <form onsubmit="handleSaveCategory(event)">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="catModalTitle">Thêm Danh Mục</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="catId">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" id="catName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Thuộc danh mục cha (Để trống nếu là danh mục gốc)</label>
                            <select id="catParent" class="form-select">
                                <option value="">-- Là danh mục gốc (Cấp 1) --</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary">Lưu danh mục</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>

    <script>
        let allCategories = [];

        async function loadCategories() {
            try {
                const res = await api.get('/danhmuc');
                if (res.success && res.data) {
                    allCategories = res.data.list;
                    renderTable();
                    populateParentSelect();
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function populateParentSelect() {
            const select = document.getElementById('catParent');
            select.innerHTML = '<option value="">-- Là danh mục gốc (Cấp 1) --</option>';
            allCategories.forEach(c => {
                select.add(new Option(c.TenDanhMuc, c.MaDanhMuc));
            });
        }

        function renderTable() {
            const tbody = document.getElementById('categoryTableBody');
            if (allCategories.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Chưa có danh mục nào.</td></tr>';
                return;
            }

            const catMap = {};
            allCategories.forEach(c => catMap[c.MaDanhMuc] = c.TenDanhMuc);

            tbody.innerHTML = allCategories.map(c => {
                const parentName = c.ParentID ? `<span class="badge bg-secondary">${catMap[c.ParentID] || 'Cấp 1'}</span>` : '<span class="badge bg-primary">Danh mục gốc</span>';
                return `
                    <tr>
                        <td class="fw-bold text-primary">#${c.MaDanhMuc}</td>
                        <td class="fw-semibold text-dark">${c.TenDanhMuc}</td>
                        <td>${parentName}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditCatModal(${c.MaDanhMuc}, '${c.TenDanhMuc.replace(/'/g, "\\'")}', ${c.ParentID})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteCategory(${c.MaDanhMuc})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openAddCatModal() {
            document.getElementById('catId').value = '';
            document.getElementById('catName').value = '';
            document.getElementById('catParent').value = '';
            document.getElementById('catModalTitle').textContent = 'Thêm Danh Mục Mới';
            new bootstrap.Modal(document.getElementById('catModal')).show();
        }

        function openEditCatModal(id, name, parentId) {
            document.getElementById('catId').value = id;
            document.getElementById('catName').value = name;
            document.getElementById('catParent').value = parentId || '';
            document.getElementById('catModalTitle').textContent = `Chỉnh Sửa Danh Mục #${id}`;
            new bootstrap.Modal(document.getElementById('catModal')).show();
        }

        async function handleSaveCategory(e) {
            e.preventDefault();
            const id = document.getElementById('catId').value;
            const name = document.getElementById('catName').value.trim();
            const parent = document.getElementById('catParent').value || null;

            try {
                let res;
                if (id) {
                    res = await api.put(`/danhmuc/${id}`, { TenDanhMuc: name, ParentID: parent });
                } else {
                    res = await api.post('/danhmuc', { TenDanhMuc: name, ParentID: parent });
                }

                if (res.success) {
                    bootstrap.Modal.getInstance(document.getElementById('catModal')).hide();
                    showToast(res.message, 'success');
                    loadCategories();
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function deleteCategory(id) {
            Swal.fire({
                title: 'Xóa danh mục #' + id + '?',
                text: 'Các cuốn sách thuộc danh mục này sẽ chuyển về không phân loại.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                confirmButtonText: 'Xóa ngay'
            }).then(async r => {
                if (r.isConfirmed) {
                    try {
                        const res = await api.delete(`/danhmuc/${id}`);
                        if (res.success) {
                            showToast(res.message, 'info');
                            loadCategories();
                        }
                    } catch (err) {
                        showToast(err.message, 'error');
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
