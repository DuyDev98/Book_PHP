<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sách - Bookstore</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand brand-logo" href="/index.html">
                <i class="bi bi-book-half me-2"></i>Bookstore
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/index.html"><i class="bi bi-house-door me-1"></i>Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/books.html"><i class="bi bi-grid me-1"></i>Tất cả sách</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-semibold" href="/books.html?is_sale=true"><i class="bi bi-fire me-1"></i>Khuyến mãi</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="/cart.html" class="btn btn-outline-light position-relative">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                    </a>
                    <div id="navbarAuth"></div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index.html" class="text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Danh sách sách</li>
            </ol>
        </nav>

        <div class="row g-4">
            <!-- Sidebar Filters -->
            <div class="col-lg-3">
                <div class="card shadow-sm border-0 rounded-3 mb-4">
                    <div class="card-body p-3">
                        <h6 class="fw-bold mb-3 d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-funnel me-2"></i>Bộ Lọc Tìm Kiếm</span>
                            <button class="btn btn-link btn-sm text-decoration-none p-0 text-muted" onclick="resetFilters()">Đặt lại</button>
                        </h6>

                        <!-- Tìm từ khóa -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Từ khóa</label>
                            <div class="input-group input-group-sm">
                                <input id="filterKeyword" type="text" class="form-control" placeholder="Tên sách, tác giả..." onkeyup="if(event.key==='Enter') applyFilters()">
                                <button class="btn btn-primary" onclick="applyFilters()"><i class="bi bi-search"></i></button>
                            </div>
                        </div>

                        <!-- Danh mục -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Danh mục</label>
                            <select id="filterCategory" class="form-select form-select-sm" onchange="applyFilters()">
                                <option value="">-- Tất cả danh mục --</option>
                            </select>
                        </div>

                        <!-- Tác giả -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Tác giả</label>
                            <select id="filterAuthor" class="form-select form-select-sm" onchange="applyFilters()">
                                <option value="">-- Tất cả tác giả --</option>
                            </select>
                        </div>

                        <!-- Nhà xuất bản -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nhà xuất bản</label>
                            <select id="filterPublisher" class="form-select form-select-sm" onchange="applyFilters()">
                                <option value="">-- Tất cả NXB --</option>
                            </select>
                        </div>

                        <!-- Khuyến mãi -->
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="filterSaleOnly" onchange="applyFilters()">
                            <label class="form-check-label small fw-semibold text-danger" for="filterSaleOnly">
                                <i class="bi bi-fire me-1"></i>Chỉ sách đang giảm giá
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Books Grid Area -->
            <div class="col-lg-9">
                <!-- Top Toolbar: Sort & Count -->
                <div class="card shadow-sm border-0 rounded-3 mb-4">
                    <div class="card-body p-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div class="small text-muted" id="resultsCount">Đang tải danh sách sách...</div>
                        <div class="d-flex align-items-center gap-2">
                            <label class="small text-muted text-nowrap">Sắp xếp theo:</label>
                            <select id="sortSelect" class="form-select form-select-sm" style="width: auto;" onchange="applyFilters()">
                                <option value="newest">Mới nhất</option>
                                <option value="price_asc">Giá: Thấp đến Cao</option>
                                <option value="price_desc">Giá: Cao đến Thấp</option>
                                <option value="discount">Giảm giá nhiều nhất</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Books List -->
                <div id="booksGrid" class="row g-4">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>

                <!-- Pagination -->
                <nav class="mt-4 d-flex justify-content-center">
                    <ul id="paginationContainer" class="pagination"></ul>
                </nav>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 mt-auto">
        <div class="container text-center small text-secondary">
            © 2026 Bookstore Online. Đồ án Chuyên đề Tổng hợp - Nhóm 9.
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>

    <script>
        let currentPage = 1;

        function getQueryParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                q: urlParams.get('q') || '',
                category_id: urlParams.get('category_id') || '',
                author_id: urlParams.get('author_id') || '',
                publisher_id: urlParams.get('publisher_id') || '',
                is_sale: urlParams.get('is_sale') === 'true',
                sort: urlParams.get('sort') || 'newest',
                page: parseInt(urlParams.get('page')) || 1
            };
        }

        async function loadFilterOptions() {
            try {
                // 1. Categories
                const catRes = await api.get('/danhmuc');
                if (catRes.success && catRes.data) {
                    const select = document.getElementById('filterCategory');
                    catRes.data.list.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.MaDanhMuc;
                        opt.textContent = c.TenDanhMuc;
                        select.appendChild(opt);
                    });
                }

                // 2. Authors
                const authRes = await api.get('/tacgia');
                if (authRes.success && authRes.data) {
                    const select = document.getElementById('filterAuthor');
                    authRes.data.forEach(a => {
                        const opt = document.createElement('option');
                        opt.value = a.MaTG;
                        opt.textContent = a.TenTG;
                        select.appendChild(opt);
                    });
                }

                // 3. Publishers
                const pubRes = await api.get('/nhaxuatban');
                if (pubRes.success && pubRes.data) {
                    const select = document.getElementById('filterPublisher');
                    pubRes.data.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.MaNXB;
                        opt.textContent = p.TenNXB;
                        select.appendChild(opt);
                    });
                }
            } catch (e) {
                console.error('Error loading filters:', e);
            }
        }

        async function fetchBooks() {
            const params = getQueryParams();
            currentPage = params.page;

            // Đồng bộ giá trị lên Form Controls
            document.getElementById('filterKeyword').value = params.q;
            document.getElementById('filterCategory').value = params.category_id;
            document.getElementById('filterAuthor').value = params.author_id;
            document.getElementById('filterPublisher').value = params.publisher_id;
            document.getElementById('filterSaleOnly').checked = params.is_sale;
            document.getElementById('sortSelect').value = params.sort;

            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';

            try {
                const res = await api.get('/sach', {
                    q: params.q,
                    category_id: params.category_id,
                    author_id: params.author_id,
                    publisher_id: params.publisher_id,
                    is_sale: params.is_sale ? true : null,
                    sort: params.sort,
                    page: params.page,
                    per_page: 9
                });

                if (res.success) {
                    document.getElementById('resultsCount').innerHTML = `Tìm thấy <strong>${res.pagination.total}</strong> cuốn sách phù hợp`;

                    if (res.data.length === 0) {
                        grid.innerHTML = `
                            <div class="col-12 text-center py-5">
                                <i class="bi bi-journal-x display-3 text-muted"></i>
                                <p class="text-muted mt-3">Không tìm thấy cuốn sách nào theo yêu cầu.</p>
                                <button class="btn btn-outline-primary btn-sm" onclick="resetFilters()">Xem tất cả sách</button>
                            </div>
                        `;
                    } else {
                        grid.innerHTML = res.data.map(renderBookCard).join('');
                    }

                    renderPagination(res.pagination);
                }
            } catch (err) {
                grid.innerHTML = `<div class="col-12 text-center text-danger py-5">Lỗi tải dữ liệu: ${err.message}</div>`;
            }
        }

        function renderBookCard(book) {
            const hasSale = book.IsSale && book.GiaSale;
            const currentPrice = hasSale ? book.GiaSale : book.GiaBan;
            const originalPrice = hasSale ? `<span class="price-original">${formatMoney(book.GiaBan)}</span>` : '';
            const saleBadge = (book.PhanTramGiamGia > 0) ? `<div class="sale-badge">-${book.PhanTramGiamGia}%</div>` : '';
            const authorName = book.tac_gia ? book.tac_gia.TenTG : 'Đang cập nhật';
            const imgUrl = book.AnhBia || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500&q=80';

            return `
                <div class="col-12 col-sm-6 col-md-4">
                    <div class="card book-card shadow-sm h-100">
                        <div class="book-img-wrapper">
                            ${saleBadge}
                            <a href="/book-detail.html?id=${book.MaSach}">
                                <img src="${imgUrl}" alt="${book.TenSach}" onerror="this.src='https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500&q=80'">
                            </a>
                        </div>
                        <div class="card-body p-3 d-flex flex-column justify-content-between">
                            <div>
                                <small class="text-muted d-block text-truncate mb-1"><i class="bi bi-pen me-1"></i>${authorName}</small>
                                <h6 class="card-title text-truncate-2 mb-2" style="font-size: 0.95rem; height: 2.6rem; overflow: hidden;">
                                    <a href="/book-detail.html?id=${book.MaSach}" class="text-dark text-decoration-none fw-semibold">
                                        ${book.TenSach}
                                    </a>
                                </h6>
                            </div>
                            <div class="mt-2">
                                <div class="mb-2">
                                    <span class="price-current">${formatMoney(currentPrice)}</span>
                                    ${originalPrice}
                                </div>
                                <div class="d-flex gap-2">
                                    <a href="/book-detail.html?id=${book.MaSach}" class="btn btn-outline-secondary btn-sm flex-fill">Chi tiết</a>
                                    <button class="btn btn-primary btn-sm flex-fill" onclick="quickAddToCart(${book.MaSach})">
                                        <i class="bi bi-cart-plus"></i> Mua
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function quickAddToCart(maSach) {
            if (!api.getToken()) {
                Swal.fire({
                    icon: 'info',
                    title: 'Yêu cầu đăng nhập',
                    text: 'Vui lòng đăng nhập để thêm sản phẩm vào giỏ hàng.',
                    confirmButtonText: 'Đăng nhập',
                    showCancelButton: true,
                    cancelButtonText: 'Để sau'
                }).then((r) => {
                    if (r.isConfirmed) window.location.href = '/login.html';
                });
                return;
            }

            try {
                const res = await api.post('/cart/add', { MaSach: maSach, SoLuong: 1 });
                if (res.success) {
                    showToast('Đã thêm vào giỏ hàng!', 'success');
                    updateCartCount();
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function renderPagination(p) {
            const container = document.getElementById('paginationContainer');
            if (p.last_page <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            // Prev
            html += `<li class="page-item ${p.current_page === 1 ? 'disabled' : ''}">
                <button class="page-link" onclick="goToPage(${p.current_page - 1})">«</button>
            </li>`;

            for (let i = 1; i <= p.last_page; i++) {
                html += `<li class="page-item ${p.current_page === i ? 'active' : ''}">
                    <button class="page-link" onclick="goToPage(${i})">${i}</button>
                </li>`;
            }

            // Next
            html += `<li class="page-item ${p.current_page === p.last_page ? 'disabled' : ''}">
                <button class="page-link" onclick="goToPage(${p.current_page + 1})">»</button>
            </li>`;

            container.innerHTML = html;
        }

        function applyFilters(page = 1) {
            const q = document.getElementById('filterKeyword').value.trim();
            const category_id = document.getElementById('filterCategory').value;
            const author_id = document.getElementById('filterAuthor').value;
            const publisher_id = document.getElementById('filterPublisher').value;
            const is_sale = document.getElementById('filterSaleOnly').checked;
            const sort = document.getElementById('sortSelect').value;

            const url = new URL(window.location);
            if (q) url.searchParams.set('q', q); else url.searchParams.delete('q');
            if (category_id) url.searchParams.set('category_id', category_id); else url.searchParams.delete('category_id');
            if (author_id) url.searchParams.set('author_id', author_id); else url.searchParams.delete('author_id');
            if (publisher_id) url.searchParams.set('publisher_id', publisher_id); else url.searchParams.delete('publisher_id');
            if (is_sale) url.searchParams.set('is_sale', 'true'); else url.searchParams.delete('is_sale');
            url.searchParams.set('sort', sort);
            url.searchParams.set('page', page);

            window.history.pushState({}, '', url);
            fetchBooks();
        }

        function goToPage(page) {
            applyFilters(page);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters() {
            window.location.href = '/books.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadFilterOptions();
            fetchBooks();
        });
    </script>
</body>
</html>
