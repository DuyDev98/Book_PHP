<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand brand-logo" href="/index.html">
                <i class="bi bi-book-half me-2"></i>Bookstore
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="/cart.html" class="btn btn-outline-light position-relative">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
                <div id="navbarAuth"></div>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index.html" class="text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item active">Hồ sơ cá nhân</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white p-4">
                        <div class="d-flex align-items-center gap-3">
                            <i class="bi bi-person-circle display-4"></i>
                            <div>
                                <h4 class="mb-0 fw-bold" id="profileName">Đang tải...</h4>
                                <small class="text-light" id="profileUsername">@username</small>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form onsubmit="handleUpdateProfile(event)">
                            <h5 class="fw-bold mb-3 border-bottom pb-2">Thông Tin Liên Hệ & Giao Hàng</h5>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" id="profHoTen" class="form-control" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Số điện thoại</label>
                                    <input type="text" id="profPhone" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Email</label>
                                    <input type="email" id="profEmail" class="form-control">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Địa chỉ nhận hàng mặc định</label>
                                <textarea id="profAddress" class="form-control" rows="2"></textarea>
                            </div>

                            <div class="d-flex justify-content-between align-items-center">
                                <a href="/orders.html" class="btn btn-outline-secondary">
                                    <i class="bi bi-bag-check me-1"></i>Xem lịch sử đơn hàng
                                </a>
                                <button type="submit" id="btnSaveProfile" class="btn btn-primary fw-semibold px-4">
                                    <i class="bi bi-check2 me-1"></i>Lưu thay đổi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 mt-auto">
        <div class="container text-center small text-secondary">
            © 2026 Bookstore Online. Đồ án Chuyên đề Tổng hợp - Nhóm 9.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>

    <script>
        async function loadProfile() {
            if (!api.getToken()) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await api.get('/auth/me');
                if (res.success && res.data) {
                    const user = res.data.user;
                    const kh = res.data.khachHang || {};

                    document.getElementById('profileName').textContent = kh.HoTen || user.Username;
                    document.getElementById('profileUsername').textContent = `@${user.Username} (${user.VaiTro})`;
                    document.getElementById('profHoTen').value = kh.HoTen || '';
                    document.getElementById('profPhone').value = kh.SDienThoai || '';
                    document.getElementById('profEmail').value = kh.Email || '';
                    document.getElementById('profAddress').value = kh.DiaChi || '';
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function handleUpdateProfile(e) {
            e.preventDefault();
            const hoTen = document.getElementById('profHoTen').value.trim();
            const phone = document.getElementById('profPhone').value.trim();
            const email = document.getElementById('profEmail').value.trim();
            const address = document.getElementById('profAddress').value.trim();

            const btn = document.getElementById('btnSaveProfile');
            btn.disabled = true;

            try {
                const res = await api.put('/auth/profile', {
                    HoTen: hoTen,
                    SDienThoai: phone,
                    Email: email,
                    DiaChi: address
                });

                if (res.success) {
                    showToast('Đã lưu thông tin cá nhân!', 'success');
                    loadProfile();
                }
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
