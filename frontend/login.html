<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký - Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="text-center mb-4">
            <a href="/index.html" class="text-decoration-none">
                <h2 class="fw-bold text-primary d-inline-flex align-items-center gap-2">
                    <i class="bi bi-book-half text-warning"></i> Bookstore Online
                </h2>
            </a>
            <p class="text-muted small">Cổng xác thực người dùng & Quản trị hệ thống</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 rounded-4 overflow-hidden">
                    <!-- Nav Tabs -->
                    <ul class="nav nav-tabs nav-fill bg-light" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-bold py-3" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-bold py-3" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button">
                                <i class="bi bi-person-plus me-1"></i>Đăng Ký
                            </button>
                        </li>
                    </ul>

                    <div class="card-body p-4 p-md-5">
                        <div class="tab-content" id="authTabContent">
                            <!-- TAB ĐĂNG NHẬP -->
                            <div class="tab-pane fade show active" id="loginPane" role="tabpanel">
                                <form onsubmit="handleLogin(event)">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Tên đăng nhập (Username)</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                                            <input type="text" id="loginUsername" class="form-control" placeholder="Nhập username" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Mật khẩu</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                            <input type="password" id="loginPassword" class="form-control" placeholder="Nhập mật khẩu" required>
                                        </div>
                                    </div>

                                    <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập
                                    </button>
                                </form>

                                <!-- Tài khoản dùng thử nhanh -->
                                <div class="mt-4 p-3 bg-light rounded-3 border small">
                                    <span class="fw-bold d-block mb-2 text-secondary"><i class="bi bi-key me-1"></i>Tài khoản dùng thử (1-click điền):</span>
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-outline-danger btn-sm flex-fill" onclick="fillAccount('admin', '123456')">
                                            <i class="bi bi-shield-lock me-1"></i>Admin
                                        </button>
                                        <button class="btn btn-outline-success btn-sm flex-fill" onclick="fillAccount('khachhang1', '123456')">
                                            <i class="bi bi-person me-1"></i>Khách hàng 1
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- TAB ĐĂNG KÝ -->
                            <div class="tab-pane fade" id="registerPane" role="tabpanel">
                                <form onsubmit="handleRegister(event)">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                                        <input type="text" id="regUsername" class="form-control" placeholder="Ví dụ: myusername" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                                        <input type="text" id="regHoTen" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
                                    </div>
                                    <div class="row g-2 mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                            <input type="password" id="regPassword" class="form-control" minlength="6" placeholder="Tối thiểu 6 ký tự" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label fw-semibold">Nhập lại MK <span class="text-danger">*</span></label>
                                            <input type="password" id="regConfirmPassword" class="form-control" minlength="6" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Số điện thoại</label>
                                        <input type="text" id="regPhone" class="form-control" placeholder="Ví dụ: 0912345678">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Email</label>
                                        <input type="email" id="regEmail" class="form-control" placeholder="name@example.com">
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-semibold">Địa chỉ giao hàng</label>
                                        <textarea id="regAddress" class="form-control" rows="2" placeholder="Số nhà, tên đường, quận/huyện..."></textarea>
                                    </div>

                                    <button type="submit" id="btnRegister" class="btn btn-warning w-100 py-2 fw-bold text-dark shadow-sm">
                                        <i class="bi bi-person-plus me-1"></i>Đăng Ký Tài Khoản
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a href="/index.html" class="text-muted text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại trang chủ Bookstore
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>

    <script>
        function fillAccount(u, p) {
            document.getElementById('loginUsername').value = u;
            document.getElementById('loginPassword').value = p;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value;

            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...`;

            try {
                const res = await api.post('/auth/login', {
                    Username: u,
                    PassWord: p
                });

                if (res.success) {
                    api.setAuth(res.data.user, res.data.token, res.data.role);

                    showToast('Đăng nhập thành công!', 'success');
                    setTimeout(() => {
                        if (res.data.role === 'admin') {
                            window.location.href = '/admin/index.html';
                        } else {
                            window.location.href = '/index.html';
                        }
                    }, 500);
                }
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i>Đăng Nhập`;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('regUsername').value.trim();
            const p = document.getElementById('regPassword').value;
            const cp = document.getElementById('regConfirmPassword').value;
            const name = document.getElementById('regHoTen').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const address = document.getElementById('regAddress').value.trim();

            if (p !== cp) {
                showToast('Mật khẩu xác nhận không khớp!', 'warning');
                return;
            }

            const btn = document.getElementById('btnRegister');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...`;

            try {
                const res = await api.post('/auth/register', {
                    Username: u,
                    PassWord: p,
                    HoTen: name,
                    SDienThoai: phone,
                    Email: email,
                    DiaChi: address
                });

                if (res.success) {
                    api.setAuth(res.data.user, res.data.token, 'customer');
                    Swal.fire({
                        icon: 'success',
                        title: 'Đăng ký thành công!',
                        text: 'Chào mừng bạn đến với nhà sách Bookstore.',
                    }).then(() => {
                        window.location.href = '/index.html';
                    });
                }
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-person-plus me-1"></i>Đăng Ký Tài Khoản`;
            }
        }

        // Kiểm tra URL params nếu muốn mở tab đăng ký
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('tab') === 'register') {
                const triggerEl = document.querySelector('#register-tab');
                bootstrap.Tab.getInstance(triggerEl) || new bootstrap.Tab(triggerEl).show();
            }
        });
    </script>
</body>
</html>
