<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sách - Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand brand-logo" href="/index.html">
                <i class="bi bi-book-half me-2"></i>Bookstore
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="/cart.html" class="btn btn-outline-light position-relative">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
                <div id="navbarAuth"></div>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index.html" class="text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item"><a href="/books.html" class="text-decoration-none">Tất cả sách</a></li>
                <li class="breadcrumb-item active" id="breadcrumbTitle">Chi tiết</li>
            </ol>
        </nav>

        <div id="bookDetailContainer" class="py-5 text-center">
            <div class="spinner-border text-primary" role="status"></div>
        </div>

        <!-- Comments & Reviews Section -->
        <div class="card shadow-sm border-0 rounded-4 mt-5">
            <div class="card-body p-4 p-md-5">
                <h4 class="fw-bold mb-4 d-flex align-items-center gap-2">
                    <i class="bi bi-chat-quote text-primary"></i> Độc Giả Nhận Xét & Đánh Giá
                </h4>

                <!-- Add Comment Form -->
                <div class="bg-light p-4 rounded-3 mb-4">
                    <h6 class="fw-semibold mb-2">Viết đánh giá của bạn</h6>
                    <p class="small text-muted mb-3">
                        <i class="bi bi-info-circle me-1"></i>Theo chính sách của nhà sách, bình luận sau khi gửi sẽ được kiểm duyệt trước khi hiển thị công khai.
                    </p>
                    <form onsubmit="submitComment(event)">
                        <div class="mb-3">
                            <textarea id="commentContent" class="form-control" rows="3" placeholder="Chia sẻ cảm nhận của bạn về cuốn sách này..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary fw-semibold">
                            <i class="bi bi-send me-1"></i>Gửi bình luận
                        </button>
                    </form>
                </div>

                <!-- Approved Comments List -->
                <div id="commentsList">
                    <div class="text-center py-3 text-muted">Đang tải bình luận...</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 mt-5">
        <div class="container text-center small text-secondary">
            © 2026 Bookstore Online. Đồ án Chuyên đề Tổng hợp - Nhóm 9.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>

    <script>
        let currentBook = null;

        function getBookId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        async function loadBookDetail() {
            const id = getBookId();
            if (!id) {
                window.location.href = '/books.html';
                return;
            }

            try {
                const res = await api.get(`/sach/${id}`);
                if (!res.success || !res.data) {
                    document.getElementById('bookDetailContainer').innerHTML = `
                        <div class="alert alert-danger">Không tìm thấy sách yêu cầu!</div>
                    `;
                    return;
                }

                currentBook = res.data;
                document.title = `${currentBook.TenSach} - Bookstore`;
                document.getElementById('breadcrumbTitle').textContent = currentBook.TenSach;

                renderBookInfo(currentBook);
                renderComments(currentBook.binh_luans || []);
            } catch (err) {
                document.getElementById('bookDetailContainer').innerHTML = `
                    <div class="alert alert-danger">Lỗi tải dữ liệu: ${err.message}</div>
                `;
            }
        }

        function renderBookInfo(b) {
            const hasSale = b.IsSale && b.GiaSale;
            const currentPrice = hasSale ? b.GiaSale : b.GiaBan;
            const originalPrice = hasSale ? `<span class="fs-5 text-muted text-decoration-line-through ms-3">${formatMoney(b.GiaBan)}</span>` : '';
            const discountBadge = (b.PhanTramGiamGia > 0) ? `<span class="badge bg-danger ms-2 fs-6">-${b.PhanTramGiamGia}%</span>` : '';
            const author = b.tac_gia ? b.tac_gia.TenTG : 'Đang cập nhật';
            const publisher = b.nha_xuat_ban ? b.nha_xuat_ban.TenNXB : 'Đang cập nhật';
            const category = b.danh_muc ? b.danh_muc.TenDanhMuc : 'Đang cập nhật';
            const bookType = b.loai_sach ? b.loai_sach.TenLoaiSach : 'Tiêu chuẩn';
            const imgUrl = b.AnhBia || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500&q=80';
            const inStock = b.SoLuongTon > 0;

            const html = `
                <div class="card shadow-sm border-0 rounded-4 overflow-hidden text-start">
                    <div class="card-body p-4 p-md-5">
                        <div class="row g-5">
                            <!-- Image Column -->
                            <div class="col-md-5 text-center">
                                <div class="p-3 bg-light rounded-4 shadow-sm d-inline-block w-100" style="max-width: 380px;">
                                    <img src="${imgUrl}" alt="${b.TenSach}" class="img-fluid rounded-3 shadow" style="max-height: 480px; width: 100%; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500&q=80'">
                                </div>
                            </div>

                            <!-- Info Column -->
                            <div class="col-md-7 d-flex flex-column justify-content-between">
                                <div>
                                    <span class="badge bg-primary-subtle text-primary mb-2">${category}</span>
                                    <h2 class="fw-bold mb-3">${b.TenSach}</h2>

                                    <div class="row g-2 mb-4 text-secondary small">
                                        <div class="col-6"><i class="bi bi-pen me-2"></i>Tác giả: <strong class="text-dark">${author}</strong></div>
                                        <div class="col-6"><i class="bi bi-building me-2"></i>NXB: <strong class="text-dark">${publisher}</strong></div>
                                        <div class="col-6"><i class="bi bi-calendar3 me-2"></i>Năm xuất bản: <strong class="text-dark">${b.NamXuatBan || 'N/A'}</strong></div>
                                        <div class="col-6"><i class="bi bi-bookmark me-2"></i>Định dạng: <strong class="text-dark">${bookType}</strong></div>
                                    </div>

                                    <!-- Price Section -->
                                    <div class="p-3 bg-light rounded-3 mb-4 d-flex align-items-center">
                                        <span class="fs-2 fw-bold text-danger">${formatMoney(currentPrice)}</span>
                                        ${originalPrice}
                                        ${discountBadge}
                                    </div>

                                    <!-- Stock info -->
                                    <div class="mb-4">
                                        <span class="fw-semibold">Trạng thái kho: </span>
                                        ${inStock 
                                            ? `<span class="badge bg-success-subtle text-success fs-6"><i class="bi bi-check-circle me-1"></i>Còn hàng (${b.SoLuongTon} cuốn)</span>` 
                                            : `<span class="badge bg-danger-subtle text-danger fs-6"><i class="bi bi-x-circle me-1"></i>Tạm hết hàng</span>`}
                                    </div>

                                    <!-- Quantity selector & Actions -->
                                    ${inStock ? `
                                        <div class="d-flex align-items-center gap-3 mb-4">
                                            <label class="fw-semibold text-nowrap">Số lượng mua:</label>
                                            <div class="input-group" style="width: 140px;">
                                                <button class="btn btn-outline-secondary" type="button" onclick="changeQty(-1)">-</button>
                                                <input id="buyQuantity" type="number" class="form-control text-center fw-bold" value="1" min="1" max="${b.SoLuongTon}">
                                                <button class="btn btn-outline-secondary" type="button" onclick="changeQty(1)">+</button>
                                            </div>
                                        </div>

                                        <div class="d-flex gap-3">
                                            <button class="btn btn-primary btn-lg px-4 fw-semibold" onclick="handleAddToCart()">
                                                <i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ
                                            </button>
                                            <button class="btn btn-warning btn-lg px-4 fw-bold text-dark" onclick="handleBuyNow()">
                                                <i class="bi bi-lightning-charge me-1"></i>Mua ngay
                                            </button>
                                        </div>
                                    ` : `
                                        <div class="alert alert-warning mb-0">Sách này tạm thời hết hàng trong kho. Bạn vui lòng quay lại sau!</div>
                                    `}
                                </div>

                                <!-- Description -->
                                <div class="mt-5 border-top pt-4">
                                    <h5 class="fw-bold mb-3"><i class="bi bi-file-text me-2"></i>Mô Tả Nội Dung Sách</h5>
                                    <p class="text-secondary lh-lg mb-0">${b.MoTa || 'Đang cập nhật tóm tắt nội dung cuốn sách này.'}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('bookDetailContainer').innerHTML = html;
        }

        function changeQty(delta) {
            const input = document.getElementById('buyQuantity');
            if (!input || !currentBook) return;
            let val = parseInt(input.value) || 1;
            val += delta;
            if (val < 1) val = 1;
            if (val > currentBook.SoLuongTon) val = currentBook.SoLuongTon;
            input.value = val;
        }

        async function handleAddToCart() {
            if (!api.getToken()) {
                askLogin();
                return;
            }

            const qty = parseInt(document.getElementById('buyQuantity').value) || 1;
            try {
                const res = await api.post('/cart/add', {
                    MaSach: currentBook.MaSach,
                    SoLuong: qty
                });
                if (res.success) {
                    showToast('Đã thêm sản phẩm vào giỏ hàng!', 'success');
                    updateCartCount();
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function handleBuyNow() {
            if (!api.getToken()) {
                askLogin();
                return;
            }

            const qty = parseInt(document.getElementById('buyQuantity').value) || 1;
            try {
                await api.post('/cart/add', {
                    MaSach: currentBook.MaSach,
                    SoLuong: qty
                });
                window.location.href = '/checkout.html';
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function askLogin() {
            Swal.fire({
                icon: 'info',
                title: 'Yêu cầu đăng nhập',
                text: 'Vui lòng đăng nhập để tiến hành mua sách.',
                confirmButtonText: 'Đăng nhập ngay',
                showCancelButton: true,
                cancelButtonText: 'Để sau'
            }).then(r => {
                if (r.isConfirmed) window.location.href = '/login.html';
            });
        }

        function renderComments(comments) {
            const container = document.getElementById('commentsList');
            if (!comments || comments.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-4 text-muted">
                        <i class="bi bi-chat-dots fs-1 d-block mb-2"></i>
                        Chưa có nhận xét nào được phê duyệt cho cuốn sách này. Hãy là người đầu tiên để lại cảm nghĩ!
                    </div>
                `;
                return;
            }

            container.innerHTML = comments.map(c => `
                <div class="border-bottom py-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="fw-bold text-dark"><i class="bi bi-person-circle me-2 text-primary"></i>${c.khach_hang ? c.khach_hang.HoTen : 'Khách độc giả'}</span>
                        <small class="text-muted">${formatDate(c.NgayBinhLuan)}</small>
                    </div>
                    <p class="text-secondary mb-0 ps-4">${c.NoiDung}</p>
                </div>
            `).join('');
        }

        async function submitComment(e) {
            e.preventDefault();
            if (!api.getToken()) {
                askLogin();
                return;
            }

            const content = document.getElementById('commentContent').value.trim();
            if (!content) return;

            try {
                const res = await api.post('/binhluan', {
                    MaSach: currentBook.MaSach,
                    NoiDung: content
                });

                if (res.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Đã gửi bình luận!',
                        text: 'Cảm ơn bạn. Bình luận của bạn đã được chuyển tới Quản trị viên để kiểm duyệt trước khi hiển thị.',
                    });
                    document.getElementById('commentContent').value = '';
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadBookDetail);
    </script>
</body>
</html>
