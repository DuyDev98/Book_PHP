<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán & Đặt Hàng - Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand brand-logo" href="/index.html">
                <i class="bi bi-book-half me-2"></i>Bookstore
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <div id="navbarAuth"></div>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index.html" class="text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item"><a href="/cart.html" class="text-decoration-none">Giỏ hàng</a></li>
                <li class="breadcrumb-item active">Thanh toán & Đặt hàng</li>
            </ol>
        </nav>

        <h3 class="fw-bold mb-4 d-flex align-items-center gap-2">
            <i class="bi bi-bag-check text-primary"></i> Xác Nhận Đơn Hàng & Thanh Toán
        </h3>

        <div id="checkoutContent">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </div>
    </main>

    <footer class="py-4 mt-auto">
        <div class="container text-center small text-secondary">
            © 2026 Bookstore Online. Đồ án Chuyên đề Tổng hợp - Nhóm 9.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>

    <script>
        let cartData = null;

        async function initCheckout() {
            if (!api.getToken()) {
                window.location.href = '/login.html';
                return;
            }

            try {
                // 1. Lấy thông tin giỏ hàng
                const cartRes = await api.get('/cart');
                if (!cartRes.success || !cartRes.data || cartRes.data.items.length === 0) {
                    Swal.fire('Giỏ hàng trống', 'Bạn chưa có sản phẩm nào trong giỏ.', 'warning').then(() => {
                        window.location.href = '/books.html';
                    });
                    return;
                }
                cartData = cartRes.data;

                // 2. Lấy thông tin khách hàng hiện tại
                const userRes = await api.get('/auth/me');
                const kh = userRes.data.khachHang || {};

                renderCheckoutForm(kh);
            } catch (err) {
                document.getElementById('checkoutContent').innerHTML = `
                    <div class="alert alert-danger">Lỗi tải dữ liệu thanh toán: ${err.message}</div>
                `;
            }
        }

        function renderCheckoutForm(kh) {
            const itemsList = cartData.items.map(item => `
                <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                    <div>
                        <div class="fw-semibold text-dark">${item.TenSach}</div>
                        <small class="text-muted">${formatMoney(item.DonGia)} x ${item.SoLuong}</small>
                    </div>
                    <span class="fw-bold text-danger">${formatMoney(item.ThanhTien)}</span>
                </div>
            `).join('');

            const shippingFee = 30000;
            const totalToPay = cartData.total_amount + shippingFee;

            const html = `
                <div class="row g-4">
                    <!-- Form Thông tin giao hàng -->
                    <div class="col-lg-7">
                        <div class="card shadow-sm border-0 rounded-4 p-4">
                            <h5 class="fw-bold mb-3 border-bottom pb-2">
                                <i class="bi bi-truck me-2 text-primary"></i>Thông Tin Giao Hàng
                            </h5>
                            <form onsubmit="handlePlaceOrder(event)">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Họ và tên người nhận <span class="text-danger">*</span></label>
                                    <input type="text" id="orderHoTen" class="form-control" value="${kh.HoTen || ''}" required>
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Số điện thoại liên hệ <span class="text-danger">*</span></label>
                                        <input type="text" id="orderPhone" class="form-control" value="${kh.SDienThoai || ''}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Email nhận thông báo</label>
                                        <input type="email" id="orderEmail" class="form-control" value="${kh.Email || ''}">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Địa chỉ nhận hàng chi tiết <span class="text-danger">*</span></label>
                                    <textarea id="orderAddress" class="form-control" rows="2" placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố..." required>${kh.DiaChi || ''}</textarea>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Ghi chú giao hàng (Tùy chọn)</label>
                                    <textarea id="orderNote" class="form-control" rows="2" placeholder="Ví dụ: Giao vào giờ hành chính, gọi trước khi đến..."></textarea>
                                </div>

                                <!-- Phương thức thanh toán -->
                                <h5 class="fw-bold mb-3 border-bottom pb-2">
                                    <i class="bi bi-credit-card me-2 text-primary"></i>Phương Thức Thanh Toán
                                </h5>
                                <div class="card p-3 border-primary mb-4 bg-primary-subtle">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="paymentMethod" id="codMethod" checked>
                                        <label class="form-check-label fw-bold text-dark" for="codMethod">
                                            <i class="bi bi-cash-coin me-1 text-success"></i> Thanh toán tiền mặt khi nhận hàng (COD)
                                        </label>
                                        <div class="small text-secondary mt-1">
                                            Bạn chỉ cần thanh toán khi nhân viên bưu tá giao sách tận tay bạn và bạn kiểm tra đúng hàng.
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" id="btnPlaceOrder" class="btn btn-warning btn-lg w-100 fw-bold text-dark shadow">
                                    <i class="bi bi-check-circle me-2"></i>Hoàn Tất Đặt Hàng (${formatMoney(totalToPay)})
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Tóm tắt đơn hàng -->
                    <div class="col-lg-5">
                        <div class="card shadow-sm border-0 rounded-4 p-4 sticky-top" style="top: 80px;">
                            <h5 class="fw-bold mb-3 border-bottom pb-2">
                                <i class="bi bi-receipt me-2 text-primary"></i>Chi Tiết Đơn Hàng (${cartData.total_items} món)
                            </h5>
                            <div class="mb-3" style="max-height: 280px; overflow-y: auto;">
                                ${itemsList}
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-secondary">Tiền hàng:</span>
                                <span class="fw-semibold">${formatMoney(cartData.total_amount)}</span>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="text-secondary">Phí vận chuyển:</span>
                                <span class="fw-semibold text-success">30.000 đ</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fs-5 fw-bold">Tổng thanh toán:</span>
                                <span class="fs-4 fw-bold text-danger">${formatMoney(totalToPay)}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('checkoutContent').innerHTML = html;
        }

        async function handlePlaceOrder(e) {
            e.preventDefault();

            const address = document.getElementById('orderAddress').value.trim();
            const note = document.getElementById('orderNote').value.trim();
            const hoTen = document.getElementById('orderHoTen').value.trim();
            const phone = document.getElementById('orderPhone').value.trim();
            const email = document.getElementById('orderEmail').value.trim();

            if (!address || !hoTen || !phone) {
                showToast('Vui lòng điền đầy đủ họ tên, SĐT và địa chỉ giao hàng.', 'warning');
                return;
            }

            const btn = document.getElementById('btnPlaceOrder');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý đơn hàng...`;

            try {
                // Cập nhật thông tin khách hàng nếu có thay đổi
                await api.put('/auth/profile', {
                    HoTen: hoTen,
                    SDienThoai: phone,
                    Email: email,
                    DiaChi: address
                });

                // Đặt hàng
                const res = await api.post('/orders/create', {
                    DiaChiGiaoHang: `${hoTen} (${phone}) - ${address}`,
                    GhiChuGiaoHang: note,
                    PhiVanChuyen: 30000
                });

                if (res.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Đặt hàng thành công!',
                        text: `Mã đơn hàng: #${res.data.MaDH}. Nhân viên sẽ sớm liên hệ giao sách cho bạn!`,
                        confirmButtonText: 'Xem đơn hàng của tôi'
                    }).then(() => {
                        window.location.href = '/orders.html';
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Đặt hàng thất bại',
                    text: err.message
                });
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-check-circle me-2"></i>Thử lại đặt hàng`;
            }
        }

        document.addEventListener('DOMContentLoaded', initCheckout);
    </script>
</body>
</html>
