<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Đơn Hàng - Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand brand-logo" href="/index.html">
                <i class="bi bi-book-half me-2"></i>Bookstore
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="/cart.html" class="btn btn-outline-light position-relative">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
                <div id="navbarAuth"></div>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index.html" class="text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item active">Lịch sử đơn hàng</li>
            </ol>
        </nav>

        <h3 class="fw-bold mb-4 d-flex align-items-center gap-2">
            <i class="bi bi-receipt text-primary"></i> Đơn Hàng Của Bạn
        </h3>

        <div id="ordersContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </div>
    </main>

    <footer class="py-4 mt-auto">
        <div class="container text-center small text-secondary">
            © 2026 Bookstore Online. Đồ án Chuyên đề Tổng hợp - Nhóm 9.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>

    <script>
        async function loadMyOrders() {
            if (!api.getToken()) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await api.get('/orders/my-orders');
                const container = document.getElementById('ordersContainer');

                if (!res.success || !res.data || res.data.length === 0) {
                    container.innerHTML = `
                        <div class="card shadow-sm border-0 rounded-4 text-center py-5">
                            <i class="bi bi-box-seam display-3 text-muted"></i>
                            <h5 class="mt-3">Bạn chưa có đơn đặt hàng nào</h5>
                            <p class="text-muted">Khi bạn đặt sách, toàn bộ lịch sử và trạng thái xử lý sẽ hiển thị tại đây.</p>
                            <div>
                                <a href="/books.html" class="btn btn-warning fw-bold text-dark px-4">Mua sách ngay</a>
                            </div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = res.data.map(renderOrderCard).join('');
            } catch (err) {
                document.getElementById('ordersContainer').innerHTML = `
                    <div class="alert alert-danger">Lỗi tải danh sách đơn hàng: ${err.message}</div>
                `;
            }
        }

        function getStatusBadge(status) {
            switch (status) {
                case 'ChoDuyet':
                    return '<span class="badge bg-warning text-dark"><i class="bi bi-hourglass-split me-1"></i>Chờ duyệt</span>';
                case 'Đang xử lý':
                    return '<span class="badge bg-info text-dark"><i class="bi bi-gear me-1"></i>Đang đóng gói</span>';
                case 'Đang giao':
                    return '<span class="badge bg-primary"><i class="bi bi-truck me-1"></i>Đang giao hàng</span>';
                case 'Đã giao':
                    return '<span class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Giao thành công</span>';
                case 'Đã hủy':
                    return '<span class="badge bg-danger"><i class="bi bi-x-circle me-1"></i>Đã hủy (Đã hoàn kho)</span>';
                default:
                    return `<span class="badge bg-secondary">${status}</span>`;
            }
        }

        function renderOrderCard(order) {
            const canCancel = ['ChoDuyet', 'Chờ xác nhận', 'Đang xử lý'].includes(order.TrangThai);
            const items = (order.chi_tiets || []).map(item => {
                const book = item.sach || {};
                return `
                    <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                        <div class="d-flex align-items-center gap-3">
                            <img src="${book.AnhBia || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500&q=80'}" class="rounded" style="width: 50px; height: 70px; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500&q=80'">
                            <div>
                                <a href="/book-detail.html?id=${book.MaSach}" class="text-dark text-decoration-none fw-semibold d-block">${book.TenSach || 'Sách'}</a>
                                <small class="text-muted">Số lượng: ${item.SoLuong} x ${formatMoney(item.DonGia)}</small>
                            </div>
                        </div>
                        <span class="fw-bold text-dark">${formatMoney(item.DonGia * item.SoLuong)}</span>
                    </div>
                `;
            }).join('');

            return `
                <div class="card shadow-sm border-0 rounded-4 mb-4 overflow-hidden">
                    <div class="card-header bg-light p-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div class="d-flex align-items-center gap-3">
                            <h6 class="fw-bold m-0 text-primary">Mã đơn: #${order.MaDH}</h6>
                            <small class="text-muted"><i class="bi bi-clock me-1"></i>${formatDate(order.NgayDat)}</small>
                        </div>
                        <div>
                            ${getStatusBadge(order.TrangThai)}
                        </div>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            ${items}
                        </div>
                        <div class="row g-2 align-items-center bg-light p-3 rounded-3">
                            <div class="col-md-7 small text-muted">
                                <div><i class="bi bi-geo-alt me-1"></i><strong>Giao tới:</strong> ${order.DiaChiGiaoHang}</div>
                                ${order.GhiChuGiaoHang ? `<div><i class="bi bi-card-text me-1"></i><strong>Ghi chú:</strong> ${order.GhiChuGiaoHang}</div>` : ''}
                            </div>
                            <div class="col-md-5 text-md-end mt-2 mt-md-0">
                                <small class="text-muted d-block">Phí ship: ${formatMoney(order.PhiVanChuyen)}</small>
                                <span class="fs-5 fw-bold text-danger">Tổng tiền: ${formatMoney(order.TongTien)}</span>
                            </div>
                        </div>
                    </div>
                    ${canCancel ? `
                        <div class="card-footer bg-white border-top text-end p-3">
                            <button class="btn btn-outline-danger btn-sm fw-semibold" onclick="cancelOrder(${order.MaDH})">
                                <i class="bi bi-x-circle me-1"></i>Hủy đơn hàng này
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        async function cancelOrder(maDH) {
            Swal.fire({
                title: 'Hủy đơn hàng #' + maDH + '?',
                text: 'Hệ thống sẽ chuyển trạng thái sang "Đã hủy" và tự động hoàn trả số lượng sách lại vào kho.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                confirmButtonText: 'Đồng ý hủy đơn',
                cancelButtonText: 'Không'
            }).then(async r => {
                if (r.isConfirmed) {
                    try {
                        const res = await api.put(`/orders/${maDH}/cancel`, {});
                        if (res.success) {
                            Swal.fire('Thành công', res.message, 'success');
                            loadMyOrders();
                        }
                    } catch (err) {
                        showToast(err.message, 'error');
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', loadMyOrders);
    </script>
</body>
</html>
