<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng Của Bạn - Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand brand-logo" href="/index.html">
                <i class="bi bi-book-half me-2"></i>Bookstore
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <div id="navbarAuth"></div>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index.html" class="text-decoration-none">Trang chủ</a></li>
                <li class="breadcrumb-item active">Giỏ hàng</li>
            </ol>
        </nav>

        <h3 class="fw-bold mb-4 d-flex align-items-center gap-2">
            <i class="bi bi-cart3 text-primary"></i> Giỏ Hàng Mua Sắm
        </h3>

        <div id="cartContent">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </div>
    </main>

    <footer class="py-4 mt-auto">
        <div class="container text-center small text-secondary">
            © 2026 Bookstore Online. Đồ án Chuyên đề Tổng hợp - Nhóm 9.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>

    <script>
        async function loadCart() {
            if (!api.getToken()) {
                document.getElementById('cartContent').innerHTML = `
                    <div class="card shadow-sm border-0 rounded-4 text-center py-5">
                        <i class="bi bi-person-lock display-3 text-muted"></i>
                        <h5 class="mt-3">Vui lòng đăng nhập để xem giỏ hàng</h5>
                        <p class="text-muted">Đăng nhập giúp đồng bộ các cuốn sách bạn muốn mua giữa các thiết bị.</p>
                        <div>
                            <a href="/login.html" class="btn btn-primary px-4 fw-semibold">Đăng nhập ngay</a>
                        </div>
                    </div>
                `;
                return;
            }

            try {
                const res = await api.get('/cart');
                if (!res.success || !res.data || res.data.items.length === 0) {
                    document.getElementById('cartContent').innerHTML = `
                        <div class="card shadow-sm border-0 rounded-4 text-center py-5">
                            <i class="bi bi-cart-x display-3 text-muted"></i>
                            <h5 class="mt-3">Giỏ hàng của bạn đang trống</h5>
                            <p class="text-muted">Hãy dạo quanh nhà sách và chọn những cuốn sách yêu thích nhé!</p>
                            <div>
                                <a href="/books.html" class="btn btn-warning fw-bold text-dark px-4">Khám phá sách ngay</a>
                            </div>
                        </div>
                    `;
                    updateCartCount();
                    return;
                }

                renderCart(res.data);
                updateCartCount();
            } catch (err) {
                document.getElementById('cartContent').innerHTML = `
                    <div class="alert alert-danger">Lỗi tải giỏ hàng: ${err.message}</div>
                `;
            }
        }

        function renderCart(cart) {
            const items = cart.items;
            const rows = items.map(item => `
                <tr>
                    <td style="width: 100px;">
                        <img src="${item.AnhBia || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500&q=80'}" class="rounded shadow-sm" style="width: 70px; height: 95px; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500&q=80'">
                    </td>
                    <td>
                        <h6 class="fw-bold mb-1">
                            <a href="/book-detail.html?id=${item.MaSach}" class="text-dark text-decoration-none">${item.TenSach}</a>
                        </h6>
                        <small class="text-muted">Đơn giá: <span class="fw-semibold text-danger">${formatMoney(item.DonGia)}</span></small>
                    </td>
                    <td style="width: 140px;">
                        <div class="input-group input-group-sm">
                            <button class="btn btn-outline-secondary" onclick="updateItemQty(${item.MaSach}, ${item.SoLuong - 1})">-</button>
                            <input type="text" class="form-control text-center fw-bold" value="${item.SoLuong}" readonly>
                            <button class="btn btn-outline-secondary" onclick="updateItemQty(${item.MaSach}, ${item.SoLuong + 1})">+</button>
                        </div>
                    </td>
                    <td class="fw-bold text-danger text-nowrap" style="width: 130px;">
                        ${formatMoney(item.ThanhTien)}
                    </td>
                    <td style="width: 50px;">
                        <button class="btn btn-link text-danger p-0" title="Xóa món này" onclick="removeItem(${item.MaSach})">
                            <i class="bi bi-trash fs-5"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

            const html = `
                <div class="row g-4">
                    <!-- Items Table -->
                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                            <div class="table-responsive">
                                <table class="table align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Ảnh</th>
                                            <th>Sách</th>
                                            <th>Số lượng</th>
                                            <th>Thành tiền</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>${rows}</tbody>
                                </table>
                            </div>
                            <div class="p-3 bg-light border-top d-flex justify-content-between align-items-center">
                                <a href="/books.html" class="btn btn-outline-secondary btn-sm">
                                    <i class="bi bi-arrow-left me-1"></i>Tiếp tục chọn sách
                                </a>
                                <button class="btn btn-outline-danger btn-sm" onclick="clearCart()">
                                    <i class="bi bi-trash3 me-1"></i>Làm trống giỏ hàng
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Summary & Checkout -->
                    <div class="col-lg-4">
                        <div class="card shadow-sm border-0 rounded-4 p-4">
                            <h5 class="fw-bold mb-3 border-bottom pb-2">Tóm Tắt Đơn Hàng</h5>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-secondary">Số lượng sách:</span>
                                <span class="fw-semibold">${cart.total_items} cuốn</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-secondary">Tạm tính:</span>
                                <span class="fw-semibold">${formatMoney(cart.total_amount)}</span>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="text-secondary">Phí vận chuyển chuẩn:</span>
                                <span class="fw-semibold text-success">30.000 đ</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <span class="fs-5 fw-bold">Tổng thanh toán:</span>
                                <span class="fs-4 fw-bold text-danger">${formatMoney(cart.total_amount + 30000)}</span>
                            </div>
                            <a href="/checkout.html" class="btn btn-warning btn-lg w-100 fw-bold text-dark shadow-sm">
                                <i class="bi bi-credit-card me-2"></i>Tiến hành đặt hàng
                            </a>
                            <div class="mt-3 text-center small text-muted">
                                <i class="bi bi-shield-check text-success me-1"></i>Thanh toán tiền mặt khi nhận hàng (COD)
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('cartContent').innerHTML = html;
        }

        async function updateItemQty(maSach, newQty) {
            if (newQty < 1) {
                removeItem(maSach);
                return;
            }

            try {
                const res = await api.put('/cart/update', {
                    MaSach: maSach,
                    SoLuong: newQty
                });
                if (res.success) {
                    loadCart();
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function removeItem(maSach) {
            Swal.fire({
                title: 'Bỏ cuốn sách này?',
                text: 'Bạn có chắc chắn muốn xóa cuốn sách này khỏi giỏ hàng?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Đồng ý',
                cancelButtonText: 'Không'
            }).then(async r => {
                if (r.isConfirmed) {
                    try {
                        const res = await api.delete(`/cart/item/${maSach}`);
                        if (res.success) {
                            showToast('Đã xóa món khỏi giỏ!', 'info');
                            loadCart();
                        }
                    } catch (err) {
                        showToast(err.message, 'error');
                    }
                }
            });
        }

        async function clearCart() {
            Swal.fire({
                title: 'Xóa toàn bộ giỏ hàng?',
                text: 'Hành động này không thể hoàn tác.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Xác nhận xóa',
                confirmButtonColor: '#dc3545',
                cancelButtonText: 'Hủy'
            }).then(async r => {
                if (r.isConfirmed) {
                    try {
                        const res = await api.delete('/cart/clear');
                        if (res.success) {
                            showToast('Đã làm trống giỏ hàng!', 'info');
                            loadCart();
                        }
                    } catch (err) {
                        showToast(err.message, 'error');
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
