<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký - Bookstore Trực Tuyến</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Custom Design System CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body style="background: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.08) 0%, transparent 40%), #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center;">

    <div class="container py-5">
        <div class="text-center mb-4">
            <a href="/index.html" class="text-decoration-none d-inline-flex align-items-center gap-2">
                <div style="width: 44px; height: 44px; background: linear-gradient(135deg, #2563eb, #1e3a8a); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.35rem; box-shadow: 0 4px 12px rgba(37,99,235,0.35);">
                    <i class="bi bi-book-half"></i>
                </div>
                <div class="text-start">
                    <span class="fs-4 fw-bold text-dark d-block lh-1">Bookstore</span>
                    <small class="text-muted fw-semibold" style="font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase;">Tri Thức Cho Mọi Nhà</small>
                </div>
            </a>
            <p class="text-muted small mt-2">Cổng đăng nhập khách hàng & tài khoản quản trị hệ thống</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden bg-white">
                    <!-- Nav Tabs -->
                    <ul class="nav nav-tabs nav-fill bg-light border-0" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-bold py-3 border-0" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button">
                                <i class="bi bi-box-arrow-in-right me-1 text-primary"></i>Đăng Nhập
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-bold py-3 border-0" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button">
                                <i class="bi bi-person-plus me-1 text-warning"></i>Đăng Ký Mới
                            </button>
                        </li>
                    </ul>

                    <div class="card-body p-4 p-md-5">
                        <div class="tab-content" id="authTabContent">
                            <!-- TAB ĐĂNG NHẬP -->
                            <div class="tab-pane fade show active" id="loginPane" role="tabpanel">
                                <form onsubmit="handleLogin(event)">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-secondary">Tên đăng nhập (Username)</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                            <input type="text" id="loginUsername" class="form-control border-start-0 ps-0" placeholder="Ví dụ: admin hoặc khachhang1" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-secondary">Mật khẩu</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                            <input type="password" id="loginPassword" class="form-control border-start-0 ps-0" placeholder="Nhập mật khẩu..." required>
                                        </div>
                                    </div>

                                    <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm mt-2">
                                        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập Hệ Thống
                                    </button>
                                </form>

                                <!-- Tài khoản demo 1-click -->
                                <div class="mt-4 p-3 bg-light rounded-3 border small">
                                    <span class="fw-bold d-block mb-2 text-secondary"><i class="bi bi-magic me-1 text-warning"></i>Điền nhanh tài khoản mẫu:</span>
                                    <div class="d-flex gap-2">
                                        <button type="button" class="btn btn-outline-danger btn-sm flex-fill rounded-pill fw-semibold" onclick="fillAccount('admin', '123456')">
                                            <i class="bi bi-shield-lock me-1"></i>Admin
                                        </button>
                                        <button type="button" class="btn btn-outline-primary btn-sm flex-fill rounded-pill fw-semibold" onclick="fillAccount('khachhang1', '123456')">
                                            <i class="bi bi-person me-1"></i>Khách hàng 1
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- TAB ĐĂNG KÝ -->
                            <div class="tab-pane fade" id="registerPane" role="tabpanel">
                                <form onsubmit="handleRegister(event)">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-secondary">Tên đăng nhập <span class="text-danger">*</span></label>
                                        <input type="text" id="regUsername" class="form-control rounded-3" placeholder="Tên tài khoản (không dấu)" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-secondary">Họ và tên <span class="text-danger">*</span></label>
                                        <input type="text" id="regHoTen" class="form-control rounded-3" placeholder="Ví dụ: Nguyễn Văn An" required>
                                    </div>
                                    <div class="row g-2 mb-3">
                                        <div class="col-6">
                                            <label class="form-label small fw-bold text-secondary">Mật khẩu <span class="text-danger">*</span></label>
                                            <input type="password" id="regPassword" class="form-control rounded-3" minlength="6" placeholder="Từ 6 ký tự" required>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small fw-bold text-secondary">Nhập lại MK <span class="text-danger">*</span></label>
                                            <input type="password" id="regConfirmPassword" class="form-control rounded-3" minlength="6" placeholder="Xác nhận" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-secondary">Số điện thoại</label>
                                        <input type="text" id="regPhone" class="form-control rounded-3" placeholder="0912345678">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-secondary">Email</label>
                                        <input type="email" id="regEmail" class="form-control rounded-3" placeholder="email@example.com">
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label small fw-bold text-secondary">Địa chỉ nhận hàng</label>
                                        <textarea id="regAddress" class="form-control rounded-3" rows="2" placeholder="Số nhà, đường, phường/xã, quận/huyện..."></textarea>
                                    </div>

                                    <button type="submit" id="btnRegister" class="btn btn-warning w-100 py-3 fw-bold text-dark rounded-pill shadow-sm">
                                        <i class="bi bi-person-plus-fill me-1"></i>Tạo Tài Khoản Mới
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="/index.html" class="text-secondary text-decoration-none small fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại trang chủ Bookstore
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>

    <script>
        function fillAccount(u, p) {
            document.getElementById('loginUsername').value = u;
            document.getElementById('loginPassword').value = p;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value;

            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Đang xác thực...`;

            try {
                const res = await api.post('/auth/login', {
                    Username: u,
                    PassWord: p
                });

                if (res.success) {
                    api.setAuth(res.data.user, res.data.token, res.data.role);

                    showToast('Đăng nhập thành công!', 'success');
                    setTimeout(() => {
                        if (res.data.role === 'admin') {
                            window.location.href = '/admin/index.html';
                        } else {
                            window.location.href = '/index.html';
                        }
                    }, 500);
                }
            } catch (err) {
                showToast(err.message || 'Tên đăng nhập hoặc mật khẩu không đúng', 'error');
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-2"></i>Đăng Nhập Hệ Thống`;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('regUsername').value.trim();
            const p = document.getElementById('regPassword').value;
            const cp = document.getElementById('regConfirmPassword').value;
            const name = document.getElementById('regHoTen').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const address = document.getElementById('regAddress').value.trim();

            if (p !== cp) {
                showToast('Mật khẩu xác nhận không khớp!', 'warning');
                return;
            }

            const btn = document.getElementById('btnRegister');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Đang khởi tạo tài khoản...`;

            try {
                const res = await api.post('/auth/register', {
                    Username: u,
                    PassWord: p,
                    HoTen: name,
                    SDienThoai: phone,
                    Email: email,
                    DiaChi: address
                });

                if (res.success) {
                    api.setAuth(res.data.user, res.data.token, 'customer');
                    Swal.fire({
                        icon: 'success',
                        title: 'Đăng Ký Thành Công!',
                        text: 'Chào mừng bạn đến với nhà sách Bookstore.',
                        confirmButtonColor: '#2563eb'
                    }).then(() => {
                        window.location.href = '/index.html';
                    });
                }
            } catch (err) {
                showToast(err.message || 'Lỗi khi đăng ký tài khoản', 'error');
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-person-plus-fill me-1"></i>Tạo Tài Khoản Mới`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('tab') === 'register') {
                const triggerEl = document.querySelector('#register-tab');
                bootstrap.Tab.getInstance(triggerEl) || new bootstrap.Tab(triggerEl).show();
            }
        });
    </script>
</body>
</html>
